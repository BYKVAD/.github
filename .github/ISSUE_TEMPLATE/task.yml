name: Task
description: "Work users don't see: housekeeping, refactoring, tooling, CI, release steps, research, decisions."
type: Task
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Fill in the sections below. The lines in <!-- --> are guidance and don't show in the issue.
      value: |
        ## Summary
        <!-- Briefly describe the task in 2-5 sentences. For a decision, title the issue "Decide: ..." and describe the options. -->


        ## Purpose
        <!-- Why is this needed? -->


        ## Scope
        This issue is done when:

        - [ ] 
        - [ ] 
        - [ ] 

        ## Notes
        <!-- Anything else that may help the person working on the issue. -->

    validations:
      required: true
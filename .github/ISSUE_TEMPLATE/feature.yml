name: Feature
description: New or changed capability users notice, including improvements to existing tools.
type: Feature
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the feature in 2-5 sentences.
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: Why is this needed?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: This issue is done when...
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything else that may help the person working on the issue.

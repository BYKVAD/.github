name: Bug
description: "The product doesn't do what it should: crash, wrong result, misleading behaviour."
type: Bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the problem in 2-5 sentences.
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: Why does this need fixing? Who is affected, and how?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: This issue is done when...
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything else that may help the person working on the issue.

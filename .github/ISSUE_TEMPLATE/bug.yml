name: Bug
description: "The product doesn't do what it should: crash, wrong result, misleading behaviour."
type: Bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Fill in the sections below. The lines in <!-- --> are guidance and don't show in the issue.
      value: |
        ## Summary
        <!-- Briefly describe the problem in 2-5 sentences. What happens, and what should happen instead? -->


        ## Purpose
        <!-- Why does this need fixing? Who is affected, and how? -->


        ## Scope
        This issue is done when:

        - [ ] 
        - [ ] 
        - [ ] 

        ## Notes
        <!-- Anything else that may help the person working on the issue. -->

    validations:
      required: true
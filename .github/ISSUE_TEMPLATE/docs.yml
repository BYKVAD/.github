name: Docs
description: "Documentation only: README, tutorial, docstrings, CONTRIBUTING."
type: Docs
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Fill in the sections below. The lines in <!-- --> are guidance and don't show in the issue.
      value: |
        ## Summary
        <!-- Briefly describe the documentation change in 2-5 sentences. -->


        ## Purpose
        <!-- Why is this needed? Who reads it? -->


        ## Scope
        This issue is done when:

        - [ ] 
        - [ ] 
        - [ ] 

        ## Notes
        <!-- Anything else that may help the person working on the issue. -->

    validations:
      required: true
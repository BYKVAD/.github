name: Docs
description: "Documentation only: README, tutorial, docstrings, CONTRIBUTING."
type: Docs
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the documentation change in 2-5 sentences.
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: Why is this needed? Who reads it?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: This issue is done when...
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything else that may help the person working on the issue.
